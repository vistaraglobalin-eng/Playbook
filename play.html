<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A3325">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Playbook Games</title>
<style>
:root{--bg:#EEF1EA;--c:#fff;--ink:#14261E;--mu:#5F6F66;--ln:#D5DCD1;--g:#0F4A35;--g2:#17624A;--y:#E8A317;--yi:#3A2600;--ok:#137A45;--no:#B3372B;--gold:#FFD35C}
[data-t=dark]{--bg:#0D1A14;--c:#152A21;--ink:#E7EFE9;--mu:#93A89C;--ln:#274436;--g:#0A3325;--g2:#1B6B50;--ok:#4CC98A;--no:#F0796C}
[data-t=midnight]{--bg:#0B1220;--c:#131D33;--ink:#E6EEFB;--mu:#8FA3C4;--ln:#24345A;--g:#0E2A5C;--g2:#2563EB;--y:#22D3EE;--yi:#04222B;--ok:#4ADE80;--no:#F87171}
[data-t=royal]{--bg:#F3EFFA;--c:#fff;--ink:#231A3A;--mu:#6B6087;--ln:#DDD3F0;--g:#3B1E78;--g2:#5B34B5;--y:#F4B63D}
[data-t=sunset]{--bg:#FFF3E8;--c:#fff;--ink:#3A1D12;--mu:#7C5B4C;--ln:#F0D5C0;--g:#8A2C1B;--g2:#C4471F;--y:#FFC145;--yi:#3A2100}
[data-t=neon]{--bg:#0A0A12;--c:#15152A;--ink:#F1EFFF;--mu:#9C98C8;--ln:#2E2C5A;--g:#1A0B3D;--g2:#D01CA0;--y:#39F5A0;--yi:#012B1A;--ok:#39F5A0;--no:#FF6B8B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow-x:hidden}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:default}
header{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;box-shadow:0 2px 12px #0005}
.brand h1{margin:0;font-size:18px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#fff 0%,#fff 40%,var(--gold) 50%,#fff 60%,#fff 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
.lv{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--gold);min-height:14px}
.lv i{display:block;width:60px;height:5px;border-radius:9px;background:#fff3;overflow:hidden}.lv i b{display:block;height:100%;background:var(--gold);transition:width .6s}
.r{display:flex;align-items:center;gap:6px}
.balp{display:flex;align-items:center;gap:6px;background:#0005;border:1px solid #fff3;border-radius:99px;padding:4px 10px 4px 4px;color:var(--gold);font-weight:900;font-variant-numeric:tabular-nums}
.balp.bump{animation:bump .3s}
.co{width:22px;height:22px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff7a8,#f5b90a 55%,#a86d00);box-shadow:inset 0 0 0 2px #c48a00}
.ib{width:36px;height:36px;border-radius:50%;border:1px solid #fff5;background:#0003;color:#fff;font-size:16px;padding:0;display:grid;place-items:center;flex:none}
.ib.dk{border-color:var(--ln);background:var(--c);color:var(--ink);font-weight:900;font-size:20px}
.banner{background:var(--y);color:var(--yi);font-size:12px;padding:5px 14px;text-align:center}
main{max-width:760px;margin:0 auto;padding:12px}
body.ingame main{padding-bottom:calc(200px + env(safe-area-inset-bottom))}
.card{background:var(--c);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px}
.warn{border-color:var(--no);color:var(--no);font-weight:600}
.meta{color:var(--mu);font-size:13px;margin:4px 0 8px}
.msg{color:var(--no);min-height:18px;margin:6px 0}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input{width:100%;padding:12px;border:1.5px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.sm{padding:9px 14px;border:1.5px solid var(--ln);border-radius:10px;background:none;color:var(--ink);font-weight:700}
.sm.danger{border-color:var(--no);color:var(--no)}
.row{display:flex;gap:8px;align-items:center;margin:10px 0}
.btn{padding:13px;border:0;border-radius:14px;background:linear-gradient(180deg,#FFE27A,#F5A623);color:#3a2600;font-weight:900;font-size:17px;letter-spacing:1px;box-shadow:0 4px 0 #8a5a00,0 0 20px #ffc83d55;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5a00}
.btn:disabled{filter:grayscale(.6);opacity:.6;animation:none!important}
.wide{width:100%}
/* splash and login */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#1b6b50,#04140d);color:#fff;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
.sp-in{text-align:center}
.pchip{width:90px;height:90px;margin:0 auto 14px;border-radius:50%;background:repeating-conic-gradient(#c40000 0 30deg,#fff 30deg 60deg);display:grid;place-items:center;animation:chipspin 1.4s ease-in-out infinite;box-shadow:0 8px 24px #000a}
.pchip::after{content:"P";width:62px;height:62px;border-radius:50%;background:#a80000;color:var(--gold);display:grid;place-items:center;font-weight:900;font-size:30px;border:3px dashed #fff8}
.sp-in h1{letter-spacing:6px;margin:0 0 14px;font-size:26px}
.lbar{width:180px;height:6px;border-radius:9px;background:#fff3;overflow:hidden;margin:0 auto}
.lbar i{display:block;height:100%;width:40%;background:var(--gold);animation:load 1s ease-in-out infinite}
.login{position:relative;overflow:hidden;max-width:420px;margin:24px auto}
.login .pchip{width:70px;height:70px}.login .pchip::after{width:48px;height:48px;font-size:22px}
.login h2{text-align:center;margin:0}
.fl{position:absolute;font-size:34px;opacity:.12;animation:floaty 7s ease-in-out infinite;pointer-events:none}
/* lobby */
.hero{position:relative;overflow:hidden;border-radius:18px;padding:16px;color:#fff;background:linear-gradient(120deg,var(--g),var(--g2),var(--g));background-size:200% 200%;animation:grad 6s ease infinite;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 6px 18px #0003}
.hero h2{margin:2px 0 6px;font-size:22px}.hero small{opacity:.85}
.hero::after{content:"";position:absolute;top:-50%;left:-30%;width:40%;height:200%;background:linear-gradient(90deg,transparent,#ffffff30,transparent);transform:rotate(20deg);animation:sweep 3.5s ease-in-out infinite;pointer-events:none}
.gift{border:0;border-radius:14px;padding:10px 12px;background:linear-gradient(180deg,#FFE27A,#F5A623);color:#3a2600;font-weight:900;box-shadow:0 4px 0 #0004;animation:wig 1.6s ease-in-out infinite;position:relative;z-index:1;line-height:1.15}
.gift small{display:block;font-size:11px;opacity:.8}
.sec{margin:18px 2px 8px;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:1.5px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:620px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;border:0;border-radius:18px;padding:0;overflow:hidden;min-height:168px;color:#fff;text-align:left;box-shadow:0 6px 16px #0004;animation:rise .5s both;transition:transform .15s;display:flex;flex-direction:column}
.tile:active{transform:scale(.96)}
.t-cricket{background:linear-gradient(160deg,#2f9e44,#0b5d22)}.t-casino{background:linear-gradient(160deg,#8e2de2,#4a00e0)}.t-roulette{background:linear-gradient(160deg,#c31432,#240b36)}
.t-lucky7{background:linear-gradient(160deg,#f7971e,#c0392b)}.t-kingjack{background:linear-gradient(160deg,#1d4ed8,#0b1d51)}.t-num{background:linear-gradient(160deg,#00b4db,#0052a5)}
.art{height:112px;display:grid;place-items:center;position:relative;width:100%}
.tl{padding:6px 12px 12px;margin-top:auto;width:100%;background:linear-gradient(transparent,#0006)}
.tl b{display:block;font-size:15px}.tl small{opacity:.85;font-size:12px}
.badge{position:absolute;top:8px;right:8px;background:#0007;border-radius:99px;padding:2px 8px;font-size:10px;font-weight:800;letter-spacing:1px;z-index:2}
.a-rw{position:relative;width:86px;height:86px}
.a-wheel{position:absolute;inset:0;border-radius:50%;border:5px solid #E8B74A;animation:spin 4s linear infinite;box-shadow:0 4px 10px #0007}
.a-wheel::after{content:"";position:absolute;inset:30%;border-radius:50%;background:radial-gradient(#ffe9a6,#b8862b)}
.a-orb{position:absolute;inset:3px;animation:spin 1.5s linear infinite reverse}
.a-orb i{position:absolute;top:0;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff}
.a-slot{display:flex;gap:4px;padding:6px;background:#0006;border-radius:10px;border:2px solid #E8B74A}
.a-reel{width:34px;height:40px;overflow:hidden;background:#fff;border-radius:6px}
.a-reel div{font-size:24px;line-height:40px;text-align:center;animation:reel .8s linear infinite}
.a-card{width:56px;height:80px;border-radius:8px;background:#fff;color:#d10000;font-size:40px;font-weight:900;display:grid;place-items:center;box-shadow:0 6px 14px #0007;animation:wob 2.2s ease-in-out infinite;position:relative;overflow:hidden}
.a-card::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,#fff9,transparent);animation:cshine 2.2s ease-in-out infinite}
.a-fan{position:relative;width:90px;height:86px}
.a-c{position:absolute;left:18px;top:2px;width:54px;height:78px;border-radius:7px;background:#fff;color:#111;font-weight:900;font-size:22px;display:grid;place-items:center;box-shadow:0 4px 10px #0006;transform-origin:50% 100%}
.a-c.k{animation:fanl 2s ease-in-out infinite}.a-c.j{color:#d10000;animation:fanr 2s ease-in-out infinite}
.a-balls{display:flex;gap:8px}
.a-balls i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:900;background:radial-gradient(circle at 35% 30%,#fff9,transparent 45%),var(--bc);animation:hop 1s ease-in-out infinite;box-shadow:0 3px 6px #0006}
.a-balls i:nth-child(2){animation-delay:.15s}.a-balls i:nth-child(3){animation-delay:.3s}
.a-cr{position:relative;width:110px;height:86px}
.a-cr .bt{position:absolute;left:10px;bottom:6px;font-size:36px;transform-origin:20% 90%;animation:swing 1.6s ease-in-out infinite}
.a-cr .bl{position:absolute;left:40px;bottom:30px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;animation:arc 1.6s ease-in infinite}
/* game view */
.gbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.gbar>b{flex:1;font-size:18px}
.streak{font-weight:900;color:#f97316;font-size:15px}
.felt{background:radial-gradient(120% 90% at 50% 0%,var(--g2),var(--g) 72%);color:#fff;border-radius:18px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 2px #ffffff22,inset 0 0 50px #0008}
.stage{min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:46px 8px 14px}
.stage.shake{animation:shake .5s}
.spks i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite;opacity:0;pointer-events:none}
.ann{position:absolute;top:10px;left:0;right:0;text-align:center;z-index:6;pointer-events:none;white-space:nowrap;overflow:hidden}
.ann b{display:inline-block;padding:5px 26px;background:linear-gradient(90deg,transparent,#000c 15%,#000c 85%,transparent);color:var(--gold);font-weight:900;letter-spacing:2px;font-size:14px;animation:annIn 2.4s forwards}
.ann b.hold{animation:annHold .5s forwards,blink 1.6s .5s infinite}
.ann b.red{color:#ff7070}.ann b.gold{font-size:16px;color:#FFE27A}
.skip{position:absolute;right:8px;bottom:8px;z-index:7;border:1px solid #fff6;background:#0008;color:#fff;border-radius:99px;padding:5px 12px;font-size:12px;font-weight:800}
.rib{display:flex;gap:5px;overflow:hidden;min-height:30px;align-items:center;margin:8px 0}
.rib b{flex:none;min-width:30px;height:28px;padding:0 7px;border-radius:99px;display:grid;place-items:center;font-size:12px;color:#fff;background:#334;animation:popIn .4s}
.rib b:first-child{box-shadow:0 0 0 2px var(--gold)}
.rib .w{background:var(--ok)}.rib .l{background:var(--no)}.rib .rd{background:#C81E1E}.rib .bk{background:#161616}.rib .gn{background:#16A34A}
.board{padding:10px;margin:0 0 8px}
.board.lock .spot{pointer-events:none}
.bh{text-align:center;font-size:12px;opacity:.8;margin:8px 0 0}
.spot{position:relative;border:2px solid #ffffff55;background:#ffffff14;color:#fff;border-radius:12px;font-weight:800;transition:transform .15s,box-shadow .2s,background .2s;padding:8px}
.spot:active{transform:scale(.95)}
.spot[aria-pressed=true]{border-color:var(--gold);background:#ffd35c33;box-shadow:0 0 0 2px var(--gold),0 0 16px #ffd35c88}
.spot.wspot{animation:wglow .6s 6;border-color:#fff}
.stk{position:absolute;right:-6px;top:-12px;z-index:3;pointer-events:none;animation:popIn .3s}
.mchip{min-width:30px;height:30px;padding:0 4px;border-radius:99px;border:2.5px dashed #fffc;color:#fff;font-size:11px;font-weight:900;font-style:normal;display:grid;place-items:center;box-shadow:0 3px 0 #0008,0 6px 0 #0004}
.rb{text-align:center;padding:10px;border-radius:12px;margin:4px 0;animation:popIn .5s}
.rb small{display:block;opacity:.9;font-weight:500;font-size:12.5px}
.rb.win{background:linear-gradient(135deg,#0d6b3b,#18a35a);color:#fff;font-size:17px;font-weight:800}
.rb.lose{background:var(--c);border:1px solid var(--ln);color:var(--mu)}
.sess{text-align:center;font-size:12.5px;color:var(--mu);margin-top:6px}
/* dock */
#dock{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#0b1712ee,#050b08f8);color:#fff;border-top:2px solid var(--gold);box-shadow:0 -6px 20px #0006;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
body.ingame #dock{display:block}
#dock.shake{animation:shake .4s}
.dk-in{max-width:520px;margin:0 auto}
.dk-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:6px}
.dk-top b{color:var(--gold);font-size:16px}
#pw{opacity:.9}#pw.bad{color:#ff8a8a;font-weight:800;opacity:1}
.dk-row{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-bottom:8px}
.rack{display:flex;gap:5px}
.dk-b{width:46px;height:46px;border-radius:12px;border:1px solid #fff4;background:#ffffff14;color:#fff;font-weight:900;font-size:16px;padding:0;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.dk-b small{font-size:9px;font-weight:600;opacity:.8;margin-top:3px}
.chip{width:44px;height:44px;border-radius:50%;border:3px dashed #ffffffd0;font-weight:900;font-size:12px;color:#fff;padding:0;box-shadow:0 3px 0 #0008,inset 0 0 0 4px #0000002a;transition:transform .12s;flex:none}
.chip:active{transform:translateY(-6px) scale(1.12)}
.chip.fly{position:fixed;z-index:80;pointer-events:none;margin:0}
.c10{background:#2563EB}.c50{background:#16A34A}.c100{background:#DC2626}.c500{background:#7C3AED}.cmax{background:#111;border-color:var(--gold)!important;color:var(--gold)}
.go{width:100%}.go:not(:disabled){animation:breath 2s ease-in-out infinite}
#dock.lock .chip,#dock.lock .dk-b{opacity:.45;pointer-events:none}
/* overlays */
#fx{position:fixed;inset:0;pointer-events:none;z-index:89}
.pop{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:46px;font-weight:900;color:#FFD35C;text-shadow:0 3px 0 #7a5200,0 0 24px #ffb800;z-index:70;pointer-events:none;animation:floatUp 1.8s ease-out forwards}
.fcoin{position:fixed;z-index:88;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7a8,#f5b90a 55%,#a86d00);box-shadow:inset 0 0 0 2px #c48a00,0 2px 4px #0006;pointer-events:none}
.bw{position:fixed;inset:0;z-index:85;background:radial-gradient(#000a,#000e);display:grid;place-items:center;overflow:hidden;animation:fade .3s}
.bw.out{animation:fadeout .35s forwards}
.rays{position:absolute;left:50%;top:50%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;background:repeating-conic-gradient(#ffd35c26 0 10deg,transparent 10deg 20deg);animation:spin 14s linear infinite;border-radius:50%}
.bwc{position:relative;text-align:center;padding:20px}
.tier{font-size:46px;font-weight:900;letter-spacing:2px;line-height:1.05;background:linear-gradient(180deg,#fff7c2,#ffd35c 45%,#d98b00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #7a4b00) drop-shadow(0 0 18px #ffb800);animation:tierIn .8s cubic-bezier(.2,1.6,.4,1) both,pulse2 1.2s .8s infinite}
.amt{font-size:42px;font-weight:900;color:#fff;margin:8px 0 22px;font-variant-numeric:tabular-nums;text-shadow:0 0 18px #ffd35c;display:flex;align-items:center;justify-content:center;gap:10px}
.amt .co{width:36px;height:36px}
.sheet{position:fixed;inset:0;z-index:90;background:#000a;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet[hidden]{display:none}
.sh-in{background:var(--c);color:var(--ink);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto;animation:up .3s cubic-bezier(.2,.9,.3,1)}
.sh-in h3{margin:0 0 4px}.sh-in h4{margin:14px 0 6px;color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stats div{background:var(--bg);border-radius:10px;padding:8px 2px}.stats b{display:block;font-size:17px}.stats small{font-size:11px;color:var(--mu)}
.achs{display:flex;flex-wrap:wrap;gap:6px}
.achs span{padding:5px 10px;border-radius:99px;background:var(--bg);font-size:12.5px;opacity:.45;filter:grayscale(1)}
.achs span.got{opacity:1;filter:none;background:#ffd35c44;border:1px solid var(--y)}
.thr{display:flex;gap:10px}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--c);box-shadow:0 0 0 1.5px var(--ln);padding:0}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--y)}
.pays{margin:8px 0;padding:0;list-style:none}.pays li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--ln)}
#toasts{position:fixed;top:calc(64px + env(safe-area-inset-top));left:0;right:0;z-index:95;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{display:flex;gap:10px;align-items:center;background:#111e;color:#fff;border:1px solid var(--gold);border-radius:14px;padding:8px 16px;box-shadow:0 6px 18px #0008;animation:drop .45s cubic-bezier(.2,.9,.3,1.3)}
.toast span{font-size:26px}.toast b{display:block;color:var(--gold)}.toast small{font-size:12px;opacity:.85}
.toast.out{animation:fadeout .4s forwards}
/* roulette */
.wwrap{position:relative;perspective:900px;display:grid;place-items:center}

.rnum{position:absolute;right:12px;bottom:12px;z-index:5}
.rnum b{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;font-size:26px;border:3px solid #fff;box-shadow:0 0 22px #fff8;animation:popIn .5s}
.rt{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.rt .spot{height:34px;border-radius:6px;font-size:12px;padding:0;border-width:1.5px}
.rt .z{grid-column:1/-1;background:#16A34A}.rt .rd{background:#C81E1E}.rt .bk{background:#161616}
.rt .stk{right:-4px;top:-8px}.rt .mchip{min-width:24px;height:24px;font-size:9px}
.outs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:6px}
.outs .spot{height:42px;font-size:12px;padding:0}
.dia{font-size:22px;line-height:1}
.dolly{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#bbb);box-shadow:0 0 10px #fff,0 2px 3px #0008;animation:dropIn .5s cubic-bezier(.2,1.6,.4,1);z-index:4}
/* slots */
.mach{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 10px 10px;border-radius:20px;background:linear-gradient(#6b4415,#2c1b06);border:3px solid #E8B74A;box-shadow:0 10px 24px #000a,inset 0 2px 0 #ffffff33}
.marq{background:#120a00;border:2px solid #E8B74A;border-radius:10px;padding:3px 12px;font-weight:900;font-size:13px;color:#FFD35C;letter-spacing:1px;text-shadow:0 0 8px #ffb800;animation:blink 1.2s steps(2) infinite}
.bulbs{display:flex;justify-content:space-between;width:100%}
.bulbs i{width:9px;height:9px;border-radius:50%;background:#ffd34d;box-shadow:0 0 8px #ffd34d;animation:bl 1s infinite}
.bulbs i:nth-child(even){animation-delay:.5s}
.mach.spin .bulbs i{animation-duration:.18s}
.mach.win .bulbs i{animation-duration:.12s;background:#7CFF8A;box-shadow:0 0 10px #7CFF8A}
.mrow{display:flex;align-items:center;gap:4px}
.reels3{display:flex;gap:5px;background:#000b;padding:7px;border-radius:12px;position:relative}
.rw{width:68px;height:204px;overflow:hidden;border-radius:10px;background:linear-gradient(#bbb,#fff 22%,#fff 78%,#bbb);position:relative}
.rw::after{content:"";position:absolute;inset:0;background:linear-gradient(#0007,transparent 30%,transparent 70%,#0007);pointer-events:none}
.rw.tease{animation:tease .3s infinite alternate}
.strip{will-change:transform}.strip.blur{filter:blur(2.5px)}
.cell{height:68px;display:grid;place-items:center;font-size:40px}
.cell.hit{animation:pulse .45s 5}
.pl{position:absolute;left:4px;right:4px;top:50%;height:2px;margin-top:-1px;background:#ff3b3b88;pointer-events:none;z-index:3}
.wl{position:absolute;left:4px;right:4px;top:50%;height:5px;margin-top:-2.5px;background:#ffd35c;box-shadow:0 0 12px #ffb800;transform:scaleX(0);transform-origin:left;z-index:4;pointer-events:none;border-radius:3px}
.wl.on{animation:draw .45s forwards}
.mach.win .reels3{animation:glow .5s 6}
.lever{position:relative;width:30px;height:170px;border:0;background:none;padding:0}
.lever::after{content:"";position:absolute;left:3px;bottom:14px;width:24px;height:34px;border-radius:6px;background:linear-gradient(90deg,#555,#bbb,#555)}
.arm{position:absolute;left:11px;bottom:44px;width:8px;height:112px;border-radius:4px;background:linear-gradient(90deg,#888,#f2f2f2,#888);transform-origin:50% 100%;transition:transform .22s ease-in}
.arm b{position:absolute;top:-16px;left:-9px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb3b3,#d10000 60%,#7a0000)}
.lever.pull .arm{transform:scaleY(-.55)}
.leds{display:flex;gap:8px;width:100%}
.leds div{flex:1;background:#000;border:2px solid #5a3a10;border-radius:8px;padding:2px 8px;font-size:10px;color:#ffb3b3;display:flex;justify-content:space-between;align-items:center}
.leds b{font-family:ui-monospace,Menlo,monospace;color:#ff4d4d;font-size:17px;text-shadow:0 0 6px #f00}
.pay{display:grid;gap:6px}
.pay div{display:flex;justify-content:space-between;padding:9px 12px;background:#0003;border-radius:10px;font-weight:800}
.pay b{color:var(--gold)}
/* cards */
.pcw{position:relative;perspective:700px;width:76px;height:108px;flex:none}
.pcw.sm{width:54px;height:78px;animation:dealIn .35s}
.pci{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.pci.flip{transform:rotateY(180deg)}
.pf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:9px;border:1px solid #0004;box-shadow:0 4px 10px #0006}
.pb{background:repeating-linear-gradient(45deg,#7f1d1d 0 6px,#b91c1c 6px 12px);border:3px solid #fff}
.pfr{background:#fff;color:#111;transform:rotateY(180deg);display:grid;place-items:center}
.pfr.rd{color:#DC2626}
.cs{font-size:40px}.sm .cs{font-size:26px}
.cr{position:absolute;left:6px;top:4px;font-size:15px;font-weight:800;line-height:1.05;text-align:center}
.cr.bt{left:auto;top:auto;right:6px;bottom:4px;transform:rotate(180deg)}
.sm .cr{font-size:11px}
.pcw.nope{filter:brightness(.55) grayscale(.4);transition:filter .3s}
.pcw.nope::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:900;color:#ff4d4d;text-shadow:0 0 4px #000;animation:popIn .3s;z-index:5}
.pcw.hero{animation:hero .9s cubic-bezier(.2,1.5,.4,1) forwards;z-index:3}
.pcw.hero .pf{box-shadow:0 0 0 3px var(--gold),0 0 26px #ffd35c}
.dealer{display:flex;align-items:center;gap:8px;align-self:stretch;padding:0 6px}
.av{width:44px;height:44px;border-radius:50%;background:radial-gradient(#ffffff33,#0005);border:2px solid var(--gold);display:grid;place-items:center;font-size:26px;flex:none}
.bub{background:#fff;color:#111;border-radius:12px;padding:6px 10px;font-size:13px;font-weight:700;position:relative;animation:popIn .3s}
.bub::before{content:"";position:absolute;left:-6px;top:50%;margin-top:-6px;border:6px solid transparent;border-right-color:#fff;border-left:0}
.l7t{display:flex;align-items:center;justify-content:center;gap:30px;min-height:126px}
.shoe{position:relative;width:62px;height:90px;transform:rotate(-8deg)}
.shoe b{position:absolute;inset:0;border-radius:8px;background:repeating-linear-gradient(45deg,#7f1d1d 0 6px,#b91c1c 6px 12px);border:3px solid #fff}
.shoe b:nth-child(1){transform:translate(-3px,-3px)}.shoe b:nth-child(2){transform:translate(-1.5px,-1.5px)}
.shoe::after{content:"";position:absolute;left:-7px;right:-7px;bottom:-7px;height:52%;background:linear-gradient(#4a3416,#1d1408);border-radius:6px;border:2px solid #E8B74A}
.cslot{width:76px;height:108px;border-radius:10px}
.cslot.seven{animation:sevenGlow .6s 5}
.ruler{display:flex;width:100%;max-width:360px;gap:2px}
.ruler i{flex:1;font-style:normal;text-align:center;font-size:11px;font-weight:800;padding:5px 0;border-radius:5px;background:#3b82f655;transition:transform .3s,box-shadow .3s}
.ruler i.lo{background:#22c55e66}.ruler i.m{background:#facc15bb;color:#000}
.ruler i.on{transform:scale(1.4);box-shadow:0 0 14px #fff;background:#fff;color:#000;position:relative;z-index:2}
.lane{display:flex;justify-content:center;align-items:center;min-height:96px;padding:0 6px}
.lane .pcw+.pcw{margin-left:-18px}
.kjc{font-weight:900;font-size:17px;min-height:26px;text-align:center}
.trio{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:8px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trio .spot,.duo .spot{padding:14px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
.spot .big{font-size:24px;line-height:1.1}
.spot small{opacity:.85;font-weight:600;color:var(--gold)}
.spot.gold{background:linear-gradient(160deg,#ffd35c55,#b8862b55)}
/* 1-9 */
#dc{width:236px;height:auto;aspect-ratio:300/320}
.tray{min-height:62px;display:grid;place-items:center;margin-top:-6px}
.bigball{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:900;color:#fff;border:3px solid #fff;background:radial-gradient(circle at 32% 28%,#fffa,transparent 40%),var(--bc);box-shadow:0 0 24px #fff8;animation:dropIn .6s cubic-bezier(.2,1.6,.4,1)}
.nine{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nine .spot{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px}
.nbb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:900;border:2px solid #fff8;background:radial-gradient(circle at 32% 28%,#fff9,transparent 40%),var(--bc);box-shadow:0 3px 6px #0006}
/* cricket */
.bcast{display:flex;align-items:stretch;gap:6px;width:100%;max-width:400px}
.bcast .vs{align-self:center;font-weight:900;color:var(--gold);font-size:12px}
.tm{flex:1;background:#000a;border-radius:10px;padding:6px 8px;border:2px solid transparent;transition:.3s;min-width:0}
.nm{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbadge{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:8.5px;font-weight:900;flex:none;border:2px solid #fff9;color:#fff}
.tm .sc{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15}
.tm small{opacity:.8;font-size:11px}
.tm.bat{border-color:var(--gold);box-shadow:0 0 12px #ffd35c66}
.tm.won{background:linear-gradient(135deg,#15803d,#0d5c2b);border-color:#fff;animation:pulse2 .8s 3}
.field{position:relative;width:min(330px,88vw);height:186px;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,#3c9a4f 0 14px,#348a45 14px 28px);border:4px solid #ffffffaa;box-shadow:inset 0 0 30px #0006;overflow:hidden}
.pitch{position:absolute;left:50%;top:50%;width:26px;height:100px;margin:-50px 0 0 -13px;background:#d6bf86;border-radius:3px}
.stp{position:absolute;left:50%;width:14px;height:6px;margin-left:-7px;background:repeating-linear-gradient(90deg,#fff 0 3px,transparent 3px 5px)}
.stp.top{top:4px}.stp.bot{bottom:4px}
.fd{position:absolute;width:10px;height:10px;border-radius:50%;background:#1e3a8a;border:2px solid #fff;margin:-5px}
.bowler{position:absolute;left:50%;top:50%;width:13px;height:13px;margin:-70px 0 0 -6.5px;border-radius:50%;background:#facc15;border:2px solid #fff}
#batter{position:absolute;left:50%;top:50%;margin:30px 0 0 2px;font-size:20px;transform-origin:20% 90%}
.cball{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;opacity:0;z-index:3}
.fxt{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:4}
.fxt b{font-size:40px;font-weight:900;color:#fff;text-shadow:0 3px 0 #0008,0 0 18px var(--gold);animation:stamp .9s forwards}
.fxt b.out{color:#ff4d4d}.fxt b.sm{font-size:24px}
.cm{min-height:42px;text-align:center;font-weight:800;font-size:15px;max-width:360px}
.pill{display:inline-block;background:#0008;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:500;margin-top:4px}
.match{background:#0003;border-radius:14px;padding:8px;margin-bottom:8px}
.match:last-child{margin-bottom:0}
.mh{font-size:11px;letter-spacing:1px;opacity:.8;margin:0 0 6px 4px;font-weight:700}
.mt{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.mt>span{font-weight:900;font-size:11px;opacity:.7}
.team{display:flex;align-items:center;gap:8px;padding:8px 6px;text-align:left}
.team .tbadge{width:34px;height:34px;font-size:10.5px}
.tn{display:flex;flex-direction:column;line-height:1.15;font-size:13px}
.odds{font-size:17px;color:var(--gold)}
/* keyframes */
@keyframes shine{to{background-position:-250% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes chipspin{50%{transform:rotateY(180deg)}}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@keyframes grad{50%{background-position:100% 50%}}
@keyframes sweep{0%,60%{left:-40%}100%{left:130%}}
@keyframes wig{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-6deg) scale(1.05)}85%{transform:rotate(6deg) scale(1.05)}}
@keyframes rise{from{transform:translateY(24px) scale(.95);opacity:0}}
@keyframes reel{to{transform:translateY(-160px)}}
@keyframes wob{50%{transform:rotate(-8deg) scale(1.06)}}
@keyframes cshine{0%,50%{left:-60%}100%{left:130%}}
@keyframes fanl{50%{transform:rotate(-18deg)}}@keyframes fanr{50%{transform:rotate(18deg)}}
@keyframes hop{50%{transform:translateY(-22px)}}
@keyframes swing{0%,40%{transform:rotate(-40deg)}50%{transform:rotate(30deg)}70%,100%{transform:rotate(-40deg)}}
@keyframes arc{0%,45%{transform:translate(0,0);opacity:0}50%{opacity:1}75%{transform:translate(40px,-55px)}100%{transform:translate(70px,-10px);opacity:0}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes tw{50%{opacity:.8;transform:scale(1.6)}}
@keyframes annIn{0%{transform:translateX(-110%);opacity:0}15%{transform:translateX(0);opacity:1}82%{transform:translateX(0);opacity:1}100%{transform:translateX(110%);opacity:0}}
@keyframes annHold{from{transform:translateX(-110%);opacity:0}}
@keyframes blink{50%{opacity:.55}}
@keyframes wglow{50%{box-shadow:0 0 0 3px #fff,0 0 22px #ffd35c;background:#ffd35c55}}
@keyframes popIn{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes breath{50%{box-shadow:0 4px 0 #8a5a00,0 0 34px #ffc83daa}}
@keyframes fade{from{opacity:0}}@keyframes fadeout{to{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes drop{from{transform:translateY(-40px) scale(.8);opacity:0}}
@keyframes tierIn{from{transform:scale(3) rotate(-8deg);opacity:0}}
@keyframes pulse2{50%{transform:scale(1.07)}}
@keyframes bump{50%{transform:scale(1.15)}}
@keyframes dealIn{from{transform:translate(-60px,-40px) rotate(-25deg) scale(.6);opacity:0}}
@keyframes hero{to{transform:translateY(-8px) scale(1.3)}}
@keyframes tease{to{box-shadow:0 0 0 3px #ff4d4d,0 0 22px #ff4d4d}}
@keyframes draw{to{transform:scaleX(1)}}
@keyframes stamp{0%{transform:scale(3);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:scale(1.1)}}
@keyframes floaty{50%{transform:translateY(-22px) rotate(10deg)}}
@keyframes floatUp{0%{transform:translateY(40px) scale(.4);opacity:0}20%{transform:translateY(0) scale(1.1);opacity:1}80%{opacity:1}100%{transform:translateY(-90px);opacity:0}}
@keyframes bl{50%{opacity:.25;box-shadow:none}}
@keyframes glow{50%{box-shadow:0 0 0 3px #ffd34d,0 0 28px #ffd34d}}
@keyframes pulse{50%{transform:scale(1.35)}}
@keyframes dropIn{from{transform:translateY(-50px) scale(.5);opacity:0}}
@keyframes sevenGlow{50%{box-shadow:0 0 0 4px #ffd35c,0 0 40px #ffd35c}}
/* shared table games */
.tg-lucky7.rl{background:radial-gradient(130% 55% at 50% 18%,#237a4d 0%,#124a30 45%,#071d13 100%)}
.tg-kingjack.rl{background:radial-gradient(130% 55% at 50% 18%,#2747a8 0%,#152c6b 45%,#070f2a 100%)}
.tg-num.rl{background:radial-gradient(130% 55% at 50% 18%,#6b3399 0%,#3b1a5e 45%,#12061f 100%)}
.tg-casino.rl{background:radial-gradient(130% 55% at 50% 18%,#8c1f3a 0%,#4d0f22 45%,#17040b 100%)}
.tg-cricket.rl{background:radial-gradient(130% 55% at 50% 10%,#2b5f9e 0%,#14325a 45%,#050d1a 100%)}
.tg-scene{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:6px 8px 32px;min-height:290px}
.tg-scene .ann{top:auto;bottom:2px}
.tboard{display:flex;flex-direction:column;gap:6px;min-width:0}
.tboard.lock{pointer-events:none}
.g2,.g3,.g4,.g7{display:grid;gap:6px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g7{grid-template-columns:repeat(7,1fr);gap:4px}
.lbl{font-size:10.5px;letter-spacing:1.5px;font-weight:800;color:#ffd35c;text-align:center;margin-top:2px}
.bs{position:relative;border:1.5px solid rgba(214,232,240,.5);border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03));color:#fff;padding:7px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:54px;transition:filter .12s,transform .12s;box-shadow:inset 0 1px 0 #ffffff22}
.bs:active{filter:brightness(1.5);transform:scale(.96)}
.bs b{font-size:13.5px;letter-spacing:.5px}.bs em{font-style:normal;font-size:10px;opacity:.8;font-weight:600;white-space:nowrap}.bs small{color:#ffd35c;font-weight:900;font-size:12px}
.bs.gold{background:linear-gradient(160deg,#ffd35c55,#8a5a0055);border-color:#ffd35c}
.bs.redb{background:linear-gradient(180deg,#b3141c88,#6e0b1088)}.bs.blkb{background:linear-gradient(180deg,#222c,#000c)}
.rs{color:#ff4a4a}
.bs.rk{min-height:44px;padding:4px 0;background:#fff;color:#111;border-color:#fff;border-radius:6px;box-shadow:0 2px 0 #0006}
.bs.rk b{font-size:15px}
.bs.rk .tcp{width:22px;height:22px;margin:-11px 0 0 -11px;font-size:8px}
.bs.big{min-height:74px}.bs.big b{font-size:17px;white-space:nowrap}
.g3 .bs.big b{font-size:14.5px;letter-spacing:0}
.bs.suit b{font-size:24px;line-height:1}
.bs.nb{min-height:62px}.bs.nb .nbb{width:38px;height:38px}
.bs.team{flex-direction:row;justify-content:flex-start;gap:7px;text-align:left;padding:8px 6px;min-height:52px}
.bs.betspot{min-height:84px;border-radius:50px;border:2px dashed #ffd35c;background:radial-gradient(#ffd35c22,transparent 70%)}
.bs.betspot b{font-size:18px;color:#ffd35c}
.bs.win{animation:twin .5s 7;z-index:1}
.hcol b.h-lo{background:#15803d;border:0}.hcol b.h-hi{background:#1d4ed8;border:0}.hcol b.h-s7{background:linear-gradient(#ffe27a,#d99a1e);color:#3a2600;border:0}
.hcol b.h-K{background:#7c3aed;border:0}.hcol b.h-J{background:#b91c1c;border:0}.hcol b.h-w{background:#15803d;border:0;font-size:11px}.hcol b.h-l{background:#5b1a1a;border:0;font-size:11px}
.hcol b.h-ball{border-radius:50%;width:26px;height:26px;border:2px solid #fff8}
.l7scene .dealer{justify-content:center}
.l7scene{position:relative;width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px 14px;border-radius:90px 90px 22px 22px;background:radial-gradient(ellipse at 50% 30%,#2e9a64,#0f4a30 75%);border:6px solid #6b3f17;box-shadow:inset 0 0 0 2px #d4ae55,inset 0 0 40px #0009,0 12px 24px #000a;overflow:hidden}
.wm{position:absolute;top:44%;left:0;right:0;text-align:center;font:italic 900 54px Georgia,serif;color:#ffffff0f;pointer-events:none;letter-spacing:4px}
.cslot.big,.cslot.big .pcw{width:92px;height:130px}.cslot.big .cs{font-size:52px}.cslot.big .cr{font-size:18px}
.disc{position:relative;width:46px;height:66px}.disc b{position:absolute;inset:0;border-radius:6px;background:repeating-linear-gradient(45deg,#7f1d1d 0 5px,#b91c1c 5px 10px);border:2px solid #fff;transform:rotate(12deg)}
.disc b:nth-child(2n){transform:rotate(-6deg) translate(2px,2px)}
.kjscene{display:grid;grid-template-columns:58px 1fr 58px;gap:6px;width:100%;max-width:440px;align-items:center}
.kjm{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.kjz{height:150px;border-radius:14px;border:2px dashed #ffd35c88;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:11px;letter-spacing:1px;background:#0004;transition:.3s}
.kjz span{font-size:28px}
.kjz.hot{border-style:solid;border-color:#ffd35c;background:#ffd35c33;animation:wglow .6s 5}
.tg-kingjack .lane{min-height:96px;width:100%}
.lotto{position:relative;display:flex;flex-direction:column;align-items:center;padding:10px 14px 4px;border-radius:26px;background:linear-gradient(#2a1240,#12061e);border:3px solid #d4ae55;box-shadow:0 10px 24px #000a,inset 0 0 20px #0008}
.lsign{font-weight:900;letter-spacing:3px;color:#ffd35c;text-shadow:0 0 10px #ffb800;font-size:13px;animation:blink 1.2s steps(2) infinite}
.stadium{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;position:relative}
.stadium::before,.stadium::after{content:"";position:absolute;top:-20px;width:120px;height:120px;border-radius:50%;background:radial-gradient(#fff6,transparent 65%);pointer-events:none}
.stadium::before{left:0}.stadium::after{right:0}
.rl{overflow:hidden;overflow:clip}
.tg-cricket .field{box-shadow:0 0 0 9px #26354f,0 0 0 11px #ffffff33,inset 0 0 30px #0006;margin:10px 0}
.tg .match{background:#0003;border-radius:12px;padding:6px}
.tg .mt{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
.bs.team .tn{min-width:0;overflow-wrap:anywhere;font-size:12.5px}
.rl{max-width:100vw}
body.rlt{overflow-x:hidden}
/* roulette full table */
body.rlt header,body.rlt .banner,body.rlt #dock{display:none!important}
body.rlt{background:#0c2430}
body.rlt main{max-width:520px;padding:0;padding-bottom:calc(66px + env(safe-area-inset-bottom))}
.rl{min-height:100vh;background:radial-gradient(130% 55% at 50% 16%,#2f6a80 0%,#1a4656 42%,#0c2430 100%);color:#fff;position:relative;overflow:hidden}
.rl-top{display:flex;align-items:center;gap:6px;padding:10px 10px 0;padding-top:max(10px,env(safe-area-inset-top));position:relative;z-index:3}
.rl-logo{flex:1;line-height:1}
.rl-logo b{display:block;font:italic 900 23px Georgia,"Times New Roman",serif;background:linear-gradient(180deg,#fff6c9,#ffd35c 50%,#c9851a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #4a2a00)}
.rl-logo small{letter-spacing:3px;font-size:9.5px;font-weight:800;opacity:.85}
.rl-wz{position:relative;display:grid;place-items:center;margin-top:-6px;padding:4px 0 2px}
#wc{width:min(350px,90vw);height:auto;aspect-ratio:1;filter:drop-shadow(0 18px 22px #000a)}
.rl-res{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:4}
.rl-res b{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;font-size:42px;font-weight:900;border:4px solid #fff;box-shadow:0 0 34px #fffa,0 8px 20px #000a;animation:resIn .7s cubic-bezier(.2,1.6,.4,1) both}
.rl-wz .ann{top:auto;bottom:0}
.rl-mid{display:grid;grid-template-columns:40px minmax(0,1fr) 60px;gap:7px;padding:6px 8px 4px;align-items:start}
.hcol{display:flex;flex-direction:column;gap:3px;align-items:center}
.hcol .hi{font-size:15px;margin:4px 0 1px}
.hcol b{width:36px;height:25px;border-radius:5px;display:grid;place-items:center;font-size:14px;font-weight:900;background:#0a1216;border:1px solid #ffffff22;font-variant-numeric:tabular-nums}
.hcol b.r{color:#ff4646}.hcol b.k{color:#fff}.hcol b.g{color:#33d26a}
.hcol b.new{border:2px solid #fff;box-shadow:0 0 10px #fff9;animation:popIn .45s}
.hcol b.hot{background:linear-gradient(#f59e0b,#c2410c);border:0;color:#fff}
.hcol b.cold{background:linear-gradient(#3b82f6,#1e3a8a);border:0;color:#fff}
.rtab{display:grid;grid-template-columns:27px 27px repeat(3,1fr);grid-template-rows:32px repeat(12,31px) 30px;border-radius:8px;position:relative}
.rtab.lock{pointer-events:none}
.tc{position:relative;border:0;padding:0;margin:0;background:transparent;color:#fff;font-weight:800;font-size:15px;display:grid;place-items:center;box-shadow:inset 0 0 0 .6px rgba(214,232,240,.6);transition:filter .12s}
.tc:active{filter:brightness(1.5)}
.tc.blank{box-shadow:none}
.tc.n.r{background:linear-gradient(#d21f26,#a8121a)}.tc.n.k{background:linear-gradient(#1d1d1d,#050505)}
.tc.z{background:linear-gradient(#17a34a,#0b6b2c);border-radius:14px 14px 0 0;font-size:16px}
.tc.v{writing-mode:vertical-rl;font-size:13.5px;letter-spacing:1px;background:rgba(255,255,255,.04)}
.tc.dz{font-size:13px}
.tc.col{font-size:12.5px;background:rgba(255,255,255,.04)}
.dm{display:block;width:15px;height:28px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.dm.r{background:#e3141c}.dm.k{background:#000;box-shadow:0 0 0 1px #fff}
.tc.win{animation:twin .5s 7;z-index:1}
@keyframes twin{50%{box-shadow:inset 0 0 0 3px #ffd35c,0 0 16px #ffd35c;filter:brightness(1.35)}}
.ccol{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:2px}
.cb{width:46px;height:46px;border-radius:50%;border:2px solid #b8913a;background:radial-gradient(circle at 40% 35%,#86703a,#3b2f12 72%);color:#ffd35c;font-weight:900;font-size:20px;box-shadow:0 3px 0 #0008,inset 0 1px 0 #ffffff40;display:grid;place-items:center;padding:0;flex:none;transition:transform .1s}
.cb:active{transform:scale(.92)}
.cb.tx{font-size:16px;font-family:Georgia,serif}
.cb.sm{width:36px;height:36px;font-size:16px}
.cb.spin{width:60px;height:60px;font-size:13px;letter-spacing:1px;color:#3a2600;border:3px solid #fff1a8;background:radial-gradient(circle at 40% 35%,#fff0a0,#e0a52a 55%,#8a5a00);animation:breath 2s ease-in-out infinite}
.cb:disabled{opacity:.4;animation:none;transform:none}
.crack{display:flex;flex-direction:column;gap:8px;align-items:center;margin-top:4px}
.cp{--cc:#1f5fd6;width:36px;height:36px;border-radius:50%;border:0;padding:0;color:#fff;font-weight:900;font-size:11px;display:grid;place-items:center;text-shadow:0 1px 1px #000c;
 background:radial-gradient(circle,var(--cc) 0 46%,rgba(255,255,255,.95) 47% 51%,var(--cc) 52% 63%,transparent 64%),repeating-conic-gradient(#fff 0 14deg,var(--cc) 14deg 45deg);
 box-shadow:0 2px 0 rgba(0,0,0,.5),0 4px 7px rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.3);transition:transform .15s}
.crack .cp.sel{transform:scale(1.25);box-shadow:0 0 0 3px #ffd35c,0 0 18px #ffd35c,0 4px 7px #0008}
.tcp{position:absolute;left:50%;top:50%;width:27px;height:27px;margin:-13.5px 0 0 -13.5px;font-size:9px;z-index:2;writing-mode:horizontal-tb;pointer-events:none;animation:chipIn .28s cubic-bezier(.2,1.5,.4,1)}
.tcp.pay{margin:-22px 0 0 -4px;z-index:3;box-shadow:0 0 0 2px #ffd35c,0 0 14px #ffd35c,0 3px 0 #0008}
.cp.fly2{position:fixed;z-index:80;width:32px;height:32px;font-size:10px;pointer-events:none}
.rtab .dolly{z-index:4}
.rl-note{text-align:center;font-size:11px;opacity:.65;margin:6px 10px 10px}
.rl-bar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;align-items:center;padding:7px 10px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(#0d1418,#000);border-top:1px solid #ffd35c66;color:#fff}
.rl-bar div{text-align:center;min-width:90px}.rl-bar small{display:block;font-size:10px;letter-spacing:1.5px;color:#ffd35c;font-weight:800}.rl-bar b{font-size:19px;font-variant-numeric:tabular-nums}
@keyframes chipIn{from{transform:translateY(-14px) scale(1.7);opacity:0}}
@keyframes resIn{from{transform:scale(.2) rotate(-90deg);opacity:0}}
@media(max-width:360px){.rl-mid{grid-template-columns:36px minmax(0,1fr) 54px;gap:5px}.cb{width:42px;height:42px}.cb.spin{width:54px;height:54px}.rtab{grid-template-columns:24px 24px repeat(3,1fr)}}
/* red carpet tables (all games) */
.rl,.tg-lucky7.rl,.tg-kingjack.rl,.tg-num.rl,.tg-casino.rl,.tg-cricket.rl{background:
 radial-gradient(120% 50% at 50% 16%,rgba(255,120,120,.22),transparent 60%),
 repeating-linear-gradient(45deg,rgba(0,0,0,.05) 0 2px,transparent 2px 5px),
 radial-gradient(140% 70% at 50% 25%,#b5142c 0%,#7d0a1d 48%,#2b030b 100%)}
body.rlt{background:#2b030b}
.rl-mid .rtab,.rl-mid .tboard{background:rgba(20,0,4,.42);padding:6px;border-radius:12px;box-shadow:inset 0 0 0 1.5px rgba(212,174,85,.55),0 6px 14px rgba(0,0,0,.35)}
.rl-top{border-bottom:1px solid rgba(212,174,85,.35);padding-bottom:6px}
.hcol b{background:#1a0206}
/* dice table */
.dtable{position:relative;width:100%;max-width:400px;height:220px;border-radius:26px;border:6px solid #5a2a0c;box-shadow:inset 0 0 0 2px #d4ae55,inset 0 0 50px rgba(0,0,0,.6),0 12px 24px rgba(0,0,0,.6);
 background:repeating-linear-gradient(45deg,rgba(0,0,0,.06) 0 2px,transparent 2px 5px),radial-gradient(ellipse at 50% 40%,#c8182f,#7a0a1a 80%);overflow:hidden;perspective:900px}
.dwm{position:absolute;inset:0;display:grid;place-items:center;font:italic 900 58px Georgia,serif;color:rgba(255,215,120,.09);letter-spacing:4px;pointer-events:none}
.dzone{position:absolute;left:50%;top:50%;width:0;height:0}
.dwrap{position:absolute;left:-25px;top:-25px;width:50px;height:50px;perspective:600px}
.dsh{position:absolute;left:4px;top:10px;width:46px;height:44px;border-radius:12px;background:rgba(0,0,0,.45);filter:blur(4px)}
.die{position:relative;width:50px;height:50px;transform-style:preserve-3d}
.die .f{position:absolute;inset:0;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:7px;border-radius:10px;background:radial-gradient(circle at 30% 25%,#ffffff,#f1f1f1 55%,#d6d6d6);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),inset -3px -4px 8px rgba(0,0,0,.18);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.die .f i{display:block}
.die .f i.pp{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#555,#0a0a0a);align-self:center;justify-self:center}
.die .f i.pp.r{width:13px;height:13px;background:radial-gradient(circle at 35% 30%,#ff6b6b,#b00000)}
.die .f1{transform:translateZ(25px)}.die .f6{transform:rotateY(180deg) translateZ(25px)}.die .f2{transform:rotateY(90deg) translateZ(25px)}.die .f5{transform:rotateY(-90deg) translateZ(25px)}.die .f3{transform:rotateX(90deg) translateZ(25px)}.die .f4{transform:rotateX(-90deg) translateZ(25px)}
.dwrap.lit .die .f1,.dwrap.lit .die .f{box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),0 0 18px #ffd35c}
.dcup{position:absolute;right:14px;bottom:18px;width:58px;height:70px;transform-origin:50% 90%}
.dcup i{position:absolute;inset:0;clip-path:polygon(12% 0,88% 0,100% 100%,0 100%);border-radius:6px;background:linear-gradient(90deg,#3a1a08,#8a4a1e 35%,#c47a3a 50%,#7a3e16 70%,#2e1405);box-shadow:inset 0 0 0 3px #d4ae55}
.dcup::before{content:"";position:absolute;left:-4px;right:-4px;bottom:-4px;height:10px;border-radius:5px;background:linear-gradient(#e8c25a,#8a6216)}
.dcup::after{content:"";position:absolute;left:8%;right:8%;top:-3px;height:8px;border-radius:4px;background:linear-gradient(#e8c25a,#8a6216)}
.dsum{position:absolute;left:12px;top:12px;min-width:74px;padding:6px 10px;border-radius:14px;text-align:center;opacity:0;transform:scale(.4);transition:opacity .3s,transform .4s cubic-bezier(.2,1.6,.4,1);background:rgba(0,0,0,.55);border:2px solid #d4ae55}
.dsum.on{opacity:1;transform:scale(1)}
.dsum b{display:block;font-size:36px;line-height:1;font-weight:900;color:#fff}
.dsum small{font-size:10.5px;font-weight:900;letter-spacing:1px;color:#ffd35c}
.dsum.s7{background:linear-gradient(#ffe27a,#d99a1e);border-color:#fff}.dsum.s7 b,.dsum.s7 small{color:#3a2600}
.druler{max-width:400px;margin-top:2px}
.a-dice{display:flex;gap:10px}
.a-dice .ad{width:42px;height:42px;animation:hop 1.1s ease-in-out infinite}
.a-dice .ad:nth-child(2){animation-delay:.25s}
.a-dice .f{position:relative;inset:auto;width:42px;height:42px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:6px;border-radius:9px;background:radial-gradient(circle at 30% 25%,#fff,#ddd);box-shadow:0 4px 8px #0007}
.a-dice .f i.pp{width:7px;height:7px;border-radius:50%;background:#111;align-self:center;justify-self:center}
.t-lucky7{background:linear-gradient(160deg,#d3243a,#5c0614)}
/* live cricket exchange */
.t-live{background:linear-gradient(120deg,#1f2a36,#3b2f12 50%,#f2a900);grid-column:1/-1}
.wide-tile{min-height:120px;flex-direction:row;align-items:center;width:100%}
.wide-tile .art{height:110px;width:42%}.wide-tile .tl{background:none;margin:0}
.livebadge{background:#dc2626!important;animation:blink 1.2s steps(2) infinite}
.a-live{position:relative;width:90px;height:90px;display:grid;place-items:center}
.a-live span{font-size:42px;position:relative;z-index:1}
.a-live i{position:absolute;inset:0;border-radius:50%;border:3px solid #ffd35c;animation:ping 2.2s ease-out infinite;opacity:0}
.a-live i:nth-child(3){animation-delay:.7s}.a-live i:nth-child(4){animation-delay:1.4s}
@keyframes ping{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.15);opacity:0}}
body.rlt .xv~*{}
.xv{min-height:100vh;background:#e4e6e9;color:#1b1d21;padding-bottom:calc(70px + env(safe-area-inset-bottom));font-size:14px}
.xh{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:6px;padding:8px 8px;padding-top:max(8px,env(safe-area-inset-top));background:linear-gradient(#ffc93c,#f2a900);color:#1b1d21;box-shadow:0 2px 6px #0004}
.xhb{border:0;background:none;font-size:30px;line-height:1;padding:0 6px;color:#1b1d21}
.xlogo{flex:1;line-height:1}.xlogo b{display:block;font:900 italic 22px/1 system-ui;letter-spacing:.5px}.xlogo small{font-size:10px;letter-spacing:3px;font-weight:800}
.xhi{border:0;background:#2a2c31;color:#fff;border-radius:4px;padding:4px 8px;min-width:56px;display:flex;flex-direction:column;align-items:center;font-size:16px;line-height:1.1}
.xhi small{font-size:10.5px;font-weight:800}.xhi.bal small{color:#ffd35c;font-variant-numeric:tabular-nums}
.xsec{display:flex;justify-content:space-between;align-items:center;background:#2a2c31;color:#fff;padding:9px 12px;font-weight:800;font-size:14px;margin-top:8px}
.xsec em{font-style:normal;color:#ff5a5a;font-size:12px;animation:blink 1.2s steps(2) infinite}
.xlh{display:grid;grid-template-columns:1fr 106px 106px;background:#fff;font-size:11px;font-weight:800;color:#666;text-align:center;padding:4px 6px 2px}
.xl{position:relative;display:grid;grid-template-columns:1fr 212px;background:#fff;border-bottom:1px solid #d6d9dd;padding:6px}
.xl-i{border:0;background:none;text-align:left;padding:0 4px 0 2px;color:inherit;display:flex;flex-direction:column;gap:1px;min-width:0}
.xl-i b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xl-t{font-size:11px;color:#666}.xl-t em{font-style:normal;font-weight:800}
.ldot{color:#e11d48;animation:blink 1.2s steps(2) infinite}.lwhen{color:#9a6b00}
.xl-sc{font-size:12px;font-weight:800;color:#0a8a3a}.xl-m{font-size:11px;color:#2f6ea8;font-weight:700}
.xl-o{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:center}.xl-o>div{display:flex;gap:3px}
.xl-ov{position:absolute;inset:0;left:auto;width:218px;display:grid;place-items:center;background:#ffffffd9;font-weight:900;font-size:12px;letter-spacing:1px;color:#444}
.xb{flex:1;min-width:0;height:48px;border:0;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#1b1d21;padding:0;transition:transform .08s}
.xb b{font-size:16px;font-variant-numeric:tabular-nums}.xb small{font-size:9.5px;color:#4b5563;font-weight:600}
.xb.sm{height:42px}.xb.sm b{font-size:14px}
.xb.back{background:#a6d8ff}.xb.lay{background:#fac9d1}
.xb:active{transform:scale(.93)}.xb:disabled{background:#e5e7eb;color:#9ca3af}
.xb.chg{animation:pchg 1.2s}
@keyframes pchg{0%,50%{box-shadow:inset 0 0 0 3px #f2a900;background:#fff3b0}}
.xmh{position:relative;display:flex;align-items:center;gap:8px;background:#3a3c42;color:#fff;padding:8px 10px;overflow:hidden}
.xback{border:0;background:none;color:#fff;font-size:28px;padding:0 4px;line-height:1}
.xmh-l{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.xlive{font-size:9px;font-weight:900;text-align:center;line-height:1.1;background:#fff;color:#3a3c42;border-radius:3px;padding:2px 4px}
.xmh-t{display:flex;flex-direction:column;min-width:0}.xmh-t b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xmh-s{text-align:right;line-height:1.15}.xmh-s .xcs{display:block;color:#8ee000;font-size:20px;font-variant-numeric:tabular-nums}.xmh-s small{font-size:12px;opacity:.9}
.xref{font-size:20px;opacity:.85}.xref.spin{animation:spin .8s ease-out}
.xev{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center}
.xev b{font-size:34px;font-weight:900;letter-spacing:2px;padding:2px 18px;border-radius:8px;animation:evIn 2.2s forwards}
.xev b.f{background:#1d4ed8;color:#fff}.xev b.s{background:linear-gradient(#a855f7,#6d28d9);color:#fff}.xev b.w{background:#dc2626;color:#fff}.xev b.d{background:#6b7280;color:#fff;font-size:22px}.xev b.r,.xev b.x{background:#0f766e;color:#fff;font-size:24px}
@keyframes evIn{0%{transform:scale(3);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(1.1);opacity:0}}
.xball{display:flex;align-items:center;gap:8px;background:#1b1d21;color:#fff;padding:7px 10px;font-weight:700;font-size:13px}
.xball>span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xbs{display:flex;gap:4px}.xbs i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:900;background:#fff;color:#111}.xbs i.nw{animation:popIn .5s}
.xbs i.f{background:#2563eb;color:#fff}.xbs i.s{background:#7c3aed;color:#fff}.xbs i.w{background:#dc2626;color:#fff}.xbs i.d{background:#4b5563;color:#fff}.xbs i.x{background:#0f766e;color:#fff}
.xstat{background:#2a2c31;color:#ffd35c;font-size:12px;font-weight:700;padding:5px 10px}
.xtabs{display:flex;background:#fff;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid #d6d9dd}
.xtabs::-webkit-scrollbar{display:none}
.xtabs button{flex:none;border:0;background:none;padding:11px 14px;font-weight:700;color:#6b7280;border-bottom:3px solid transparent;font-size:14px}
.xtabs button.on{color:#1b1d21;border-bottom-color:#1b1d21;background:#f3f4f6}
.xinfo{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:7px 10px;font-size:12px;color:#6b7280}
.xinfo button{border:0;background:#e5e7eb;border-radius:4px;padding:6px 10px;font-weight:700;color:#1b1d21}
.xmk{position:relative;margin-top:8px;background:#fff}
.xmk-h{display:flex;justify-content:space-between;align-items:center;background:#3a3c42;color:#fff;padding:9px 12px;font-weight:800}
.xmk-h em{font-style:normal;font-size:12px;color:#ffd35c}
.xmk-c{display:grid;grid-template-columns:1fr 74px 74px;gap:4px;padding:6px 8px 4px 12px;font-size:12px;color:#4b5563;font-weight:700}.xmk-c .xcol{text-align:center}
.xr{display:grid;grid-template-columns:1fr 74px 74px;gap:4px;align-items:center;padding:4px 8px 4px 12px;border-top:1px solid #eceef1}
.xr.on.back{background:#e8f4fd}.xr.on.lay{background:#fdeef1}
.xn{min-width:0}.xn b{display:block;font-size:14.5px;overflow-wrap:anywhere}
.xn small{font-weight:800;font-size:12px}.xn small.pos{color:#0a8a3a}.xn small.neg{color:#d11a2a}
.xov{position:absolute;left:0;right:0;top:38px;bottom:0;display:grid;place-items:center;background:#ffffffd6;font-weight:900;letter-spacing:2px;color:#374151}
.xslip{padding:8px 10px 10px;border-top:1px solid #d6d9dd}.xslip.fresh{animation:slipIn .25s ease-out}
.xslip.back{background:#d7ecfb}.xslip.lay{background:#fbe3e8}
@keyframes slipIn{from{opacity:0;transform:translateY(-8px)}}
.xs-t{font-size:13px;color:#374151;margin-bottom:8px}
.xs-st{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.xst{display:grid;grid-template-columns:40px 1fr 40px;height:44px;border-radius:4px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px #c7cbd1}
.xst.act{box-shadow:0 0 0 2px #f2a900}
.xst button{border:0;background:#e5e7eb;font-size:22px;font-weight:700;color:#1b1d21}
.xst span{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}.xst span small{font-size:9px;color:#6b7280;font-weight:600;margin-top:2px}
.xs-a{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.xs-c{border:0;border-radius:4px;background:#d1d5db;height:46px;font-weight:800}
.xs-p{border:0;border-radius:4px;background:linear-gradient(#ffc93c,#f2a900);height:46px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.xs-p small{font-size:11px;font-weight:600}.xs-p:disabled{opacity:.5}
.xs-msg{min-height:16px;margin:6px 0 4px;color:#b91c1c;font-weight:700;font-size:12.5px}

function drumStep(dt){const mix=D.mode==="mix";D.ang+=mix?.08:.008;const bs=D.balls.filter(b=>!b.out&&!(D.ex&&D.ex.b===b));
 bs.forEach(b=>{if(mix&&b.y>DR*.1&&Math.random()<.3){b.vy-=Math.random()*3.4;b.vx+=(Math.random()-.5)*3}
  b.vy+=.32;b.vx*=.99;b.vy*=.99;b.x+=b.vx;b.y+=b.vy;
  const d=Math.hypot(b.x,b.y),lim=DR-BR-3;if(d>lim){const nx=b.x/d,ny=b.y/d,dot=b.vx*nx+b.vy*ny;if(dot>0){b.vx-=1.7*dot*nx;b.vy-=1.7*dot*ny}b.x=nx*lim;b.y=ny*lim;if(mix){b.vx+=-ny*.6;b.vy+=nx*.6}}});
 for(let i=0;i<bs.length;i++)for(let j=i+1;j<bs.length;j++){const a=bs[i],b=bs[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01;
  if(d<BR*2){const nx=dx/d,ny=dy/d,o=(BR*2-d)/2;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;const p=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;if(p>0){a.vx-=p*nx;a.vy-=p*ny;b.vx+=p*nx;b.vy+=p*ny}}}
 if(D.ex){const e=D.ex,b=e.b;e.u=Math.min(1,e.u+dt/Math.max(1,1200*spd()));const u=e.u,oy=DR-BR-2;

 c.fillStyle=gg;c.beginPath();c.arc(x,y,BR,0,7);c.fill();c.fillStyle="#fff";c.beginPath();c.arc(x,y,8.5,0,7);c.fill();c.fillStyle="#111";c.font="bold 12px system-ui";c.textAlign="center";c.textBaseline="middle";c.fillText(n,x,y+.5);
 if(NUMMARK.has(n)){c.strokeStyle="#FFD35C";c.lineWidth=2.5;c.beginPath();c.arc(x,y,BR+1.5,0,7);c.stroke()}}
function drumDraw(c){c.setTransform(2,0,0,2,0,0);c.clearRect(0,0,300,320);const cx=150,cy=136;
 c.fillStyle="#0009";c.fillRect(cx-21,cy+DR-8,42,200);c.strokeStyle="#E8B74A";c.lineWidth=3;c.beginPath();c.moveTo(cx-22,cy+DR-8);c.lineTo(cx-22,320);c.moveTo(cx+22,cy+DR-8);c.lineTo(cx+22,320);c.stroke();
 const g=c.createRadialGradient(cx-30,cy-40,10,cx,cy,DR);g.addColorStop(0,"rgba(255,255,255,.28)");g.addColorStop(1,"rgba(255,255,255,.05)");c.fillStyle=g;c.beginPath();c.arc(cx,cy,DR,0,7);c.fill();
 c.save();c.translate(cx,cy);c.rotate(D.ang);c.strokeStyle="rgba(255,255,255,.14)";c.lineWidth=2;for(let i=0;i<6;i++){c.beginPath();c.moveTo(0,0);c.lineTo(DR,0);c.stroke();c.rotate(Math.PI/3)}c.restore();
 D.balls.forEach(b=>{if(!b.out)ballDraw(c,cx+b.x,cy+b.y,b.n)});
 c.strokeStyle="#E8B74A";c.lineWidth=6;c.beginPath();c.arc(cx,cy,DR,Math.PI/2+.2,Math.PI/2-.2+Math.PI*2);c.stroke();
 c.strokeStyle="rgba(255,255,255,.4)";c.lineWidth=3;c.beginPath();c.arc(cx,cy,DR-12,Math.PI*1.1,Math.PI*1.45);c.stroke()}
async function anNum(o){const t=+o.big;$("tray").innerHTML="";D.balls.forEach(b=>{if(b.out){b.out=false;b.x=(Math.random()-.5)*60;b.y=-50;b.vx=0;b.vy=0}});
 D.mode="mix";SND.whoosh();SND.rumble(2.8*K);const rt=setInterval(()=>rattle(5,.25,.25),220);await wait(2700);clearInterval(rt);D.mode="idle";rattle(10,.8,.2);

 await new Promise(r=>{D.ex={b,u:0,x0:b.x,y0:b.y,done:r};setTimeout(()=>{if(D.ex){D.ex=null;b.out=true;r()}},4500)});

async function delivery(kind){const F=$("field");if(!F)return;const bw=$("bowler"),b=$("cball"),bt=$("batter"),stp=$("stumps"),W2=F.clientWidth/2,H2=F.clientHeight/2;
 stp.getAnimations().forEach(x=>x.cancel());
 await anim(bw,[{transform:"translateY(-28px)"},{transform:"translateY(0)"}],380,"ease-in");
 b.style.opacity=1;SND.tick();
 await anim(b,[{transform:"translate(0,-52px) scale(.9)"},{transform:"translate(0,14px) scale(1.25)",offset:.6},{transform:"translate(0,40px) scale(1)"}],360,"linear");
 anim(bt,[{transform:"rotate(-60deg)"},{transform:"rotate(45deg)"},{transform:"rotate(0)"}],360);if(kind!=="dot"&&kind!=="wk")setTimeout(SND.bat,150*spd());
 if(kind==="wk"){SND.thunk();await anim(b,[{transform:"translate(0,40px)"},{transform:"translate(0,46px)"}],120);anim(stp,[{transform:"none"},{transform:"translate(16px,8px) rotate(75deg)",opacity:.5}],500);stamp("OUT!","out");SND.ooh();await wait(850)}
 else if(kind==="six"){const a=-Math.PI*(.12+Math.random()*.76),x=Math.cos(a)*W2*1.15,y=Math.sin(a)*H2*1.15;SND.thunk();
  await anim(b,[{transform:"translate(0,40px) scale(1)"},{transform:`translate(${x*.5}px,${y*.5}px) scale(2.8)`,offset:.5},{transform:`translate(${x}px,${y}px) scale(1)`}],850);
  stamp("SIX!");SND.cheer(1.2);const r=F.getBoundingClientRect();fireworks(r.left+W2+x*.85,r.top+H2+y*.85);await wait(750)}
 else if(kind==="four"){const a=Math.random()*Math.PI*2,x=Math.cos(a)*W2*.95,y=Math.sin(a)*H2*.95;SND.thunk();await anim(b,[{transform:"translate(0,40px)"},{transform:`translate(${x}px,${y}px)`}],600);stamp("FOUR!");SND.cheer(.8);await wait(650)}
 else if(kind==="run"){const fds=F.querySelectorAll(".fd"),fd=fds[rnd(fds.length)],x=fd.offsetLeft-W2,y=fd.offsetTop-H2;SND.tick();await anim(b,[{transform:"translate(0,40px)"},{transform:`translate(${x}px,${y}px)`}],520);stamp(Math.random()<.5?"1 RUN":"2 RUNS","sm");await wait(420)}
 else{await anim(b,[{transform:"translate(0,40px)"},{transform:"translate(0,78px)"}],260);stamp("DOT","sm");await wait(320)}
 b.style.opacity=0;b.getAnimations().forEach(x=>x.cancel());bw.getAnimations().forEach(x=>x.cancel());bt.getAnimations().forEach(x=>x.cancel())}
const CMT={four:"FOUR! Cracking shot 🏏",six:"SIX! Into the crowd 🚀",wk:"WICKET! ☝️",run:"Quick running between the wickets",dot:"Dot ball — well bowled"};
async function innings(ix,runs,wk,balls,target,endKind){const el=$("t"+ix),sc=el.querySelector(".sc"),sm=el.querySelector("small"),N=5,nm=el.querySelector(".nm").textContent.replace(/^\S+/,"");
 el.classList.add("bat");const wkEv=Math.min(wk,2),evs=[];for(let i=0;i<N-1;i++)evs.push(i<wkEv?"wk":["four","six","run","dot","four","run"][rnd(6)]);
 for(let i=evs.length-1;i>0;i--){const j=rnd(i+1);[evs[i],evs[j]]=[evs[j],evs[i]]}evs.push(endKind);
 let pr=0,pw=0,pb=0;const tg=target?" · target "+target:"";
 for(let k=1;k<=N;k++){const cr=k===N?runs:Math.min(runs,Math.max(pr,Math.round(runs*k/N*(.88+Math.random()*.14)))),cw=k===N?wk:Math.min(wk,Math.max(pw,Math.round(wk*k/N))),cb=Math.round(balls*k/N);
  const r0=pr,b0=pb;$("cm").textContent=`Over ${Math.floor(cb/6)} · ${nm} batting`;
  await tween(420,u=>{sc.textContent=Math.round(r0+(cr-r0)*u)+"/"+pw;sm.textContent=ovs(Math.round(b0+(cb-b0)*u))+" ov"+tg});
  await delivery(evs[k-1]);$("cm").textContent=CMT[evs[k-1]];sc.textContent=cr+"/"+cw;pr=cr;pw=cw;pb=cb}
 sc.textContent=runs+"/"+wk;sm.textContent=ovs(balls)+" ov"+tg;el.classList.remove("bat")}
async function anCricket(o){cboard();const m=/^(.+?) (\d+)\/(\d+) beat (.+?) (\d+) all out$/.exec(o.txt);
 if(!m){$("cm").textContent="Match in progress…";await wait(2500);return}
 const wn=m[1],wr=+m[2],ww=+m[3],ln=m[4],lr=+m[5],mi=+pick[0],ti=wn===MT[mi][0]?0:1,li=1-ti,wf=Math.random()<.5;
 $("cm").textContent="🪙 Toss… "+(wf?wn:ln)+" will bat first";SND.spin();await wait(1200);
 if(wf){await innings(ti,wr,ww,300,0,"run");$("cm").textContent=`${ln} need ${wr+1} to win`;await wait(900);await innings(li,lr,10,220+rnd(70),wr+1,"wk")}
 else{await innings(li,lr,10,220+rnd(70),0,"wk");$("cm").textContent=`${wn} need ${lr+1} to win`;await wait(900);await innings(ti,wr,ww,200+rnd(90),lr+1,Math.random()<.5?"six":"four")}
 const te=$("t"+ti);te.classList.add("won");const r=te.getBoundingClientRect();fireworks(r.left+r.width/2,r.top+r.height/2);SND.cheer(1.4);

/* ---------------- round flow ---------------- */
function tagFor(o,won){
 if(game==="roulette"){const n=+o.big;return{l:String(n),c:n===0?"gn":RED.includes(n)?"rd":"bk"}}
 if(game==="casino")return{l:won?o.mult+"×":"–",c:won?"w":"l"};
 if(game==="cricket")return{l:won?"W":"L",c:won?"w":"l"};
 return{l:o.big,c:won?"w":"l"}}
function winSpots(o,won){
 if(game==="roulette"){const n=+o.big,a=[String(n)];if(n>0)a.push(RED.includes(n)?"red":"black",n%2?"odd":"even",n<=18?"low":"high");return a}
 if(game==="lucky7"){const i=RK.indexOf(o.big.slice(0,-1));return[i<6?"lo":i===6?"7":"hi"]}
 if(game==="kingjack")return[o.big.slice(0,-1)];
 if(game==="num")return[String(+o.big)];
 if(game==="cricket")return[pick[0]+(won?pick[1]:pick[1]==="a"?"b":"a")];return[]}
function markWin(o,won){winSpots(o,won).forEach(p=>{const e=document.querySelector(`#board [data-p="${p}"]`);if(e)e.classList.add("wspot")});
 if(game==="roulette"){const e=document.querySelector(`#board [data-p="${+o.big}"]`);if(e)e.insertAdjacentHTML("beforeend",'<i class="dolly"></i>')}}
function clearMarks(){document.querySelectorAll(".wspot").forEach(e=>e.classList.remove("wspot"));document.querySelectorAll(".dolly").forEach(e=>e.remove())}
function resultLabel(o){
 if(game==="roulette"){const n=+o.big;return n+" "+(n===0?"GREEN":RED.includes(n)?"RED":"BLACK")}
 if(game==="casino")return o.parts.join(" ");
 if(game==="num")return "NUMBER "+o.big;
 if(game==="cricket"){const m=/^(.+?) \d/.exec(o.txt);return (m?m[1]:"Match")+" WIN"}
 return o.big+" · "+o.txt}

 d.innerHTML=`<div class="rays"></div><div class="bwc"><div class="tier">${tier}</div><div class="amt"><span class="co"></span><span id="bwa">0</span></div><button class="btn" id="bwb" style="padding:13px 40px">COLLECT</button></div>`;
 document.body.appendChild(d);SND.big();let done=false;const iv=setInterval(()=>burst(14,true,innerWidth/2,innerHeight*.3),280);
 tween(2200,u=>{const e=$("bwa");if(e)e.textContent=fmt(pay*(1-Math.pow(1-u,2)));if(u<1)SND.coin()});

 if(won){announce("YOU WIN "+fmt(pay)+"!",false,"gold");$("out2").innerHTML=`<div class="rb win">🎉 You won ${fmt(pay)} coins<small>${esc(o.txt)}</small></div>`;

async function play(){
 if(busy)return;const st=stake;
 if(S.maint)return flash("Paused for maintenance");
 if(game!=="casino"&&pick===null)return flash("Pick a bet spot first");

 if(r.error){busy=false;lockUI(false);tweenBal(me.coins,300);flash(friendly(r.error.message));announce("PLACE YOUR BETS",true);return}

 (hist[game]=hist[game]||[]).unshift(tagFor(o,won));hist[game]=hist[game].slice(0,14);$("rib").innerHTML=ribHtml();
 markWin(o,won);await settle(o,st,won,pay);$("sess").textContent=sessTxt();progress(st,won,o.mult,pay);
 busy=false;lockUI(false);updDock();announce("PLACE YOUR BETS",true)}
